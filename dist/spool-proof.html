<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>FANBOX 1件保存の実証設定</title></head>
<body><h1>FANBOX 1件保存の実証設定</h1>
<p>専用Chromiumと同じPCの補助サービス（127.0.0.1:18096）だけに接続します。Eagle登録は行いません。</p>
<p>拡張機能ID: <code id="extensionId"></code></p>
<form id="config"><label>補助サービスのAPIトークン <input id="token" type="password" autocomplete="off" required minlength="32" maxlength="128"></label>
<button type="submit">保存</button></form>
<p>トークンは一般設定のエクスポートには含めません。Cookieは入力しないでください。</p>
<output id="status" aria-live="polite"></output><script src="spool-proof-options.js"></script></body></html>
